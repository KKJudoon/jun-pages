<header class="collector-top"><a href="/jun-pages/">生意中台</a></header><nav class="collector-nav"><a href="/jun-pages/admin/users/">用户与安全</a><a href="/jun-pages/admin/collectors/" aria-current="page">采集器状态</a></nav>
<main class="collector-page">
<div class="collector-heading"><div><p class="text-secondary">系统管理 · Starfish</p><h1>采集器状态</h1><p>查看采集计划、执行结果和数据去向。时间均为北京时间。</p></div><button id="refresh" class="btn btn-primary" type="button">刷新状态</button></div>
<div id="connection" role="status" aria-live="polite">正在读取 Starfish 状态…</div>
<div id="summary" class="collector-summary"></div>
<section class="collector-filters" aria-label="筛选采集任务"><label>分类<select id="group"><option value="">全部分类</option><option>日常采集</option><option>月度采集</option><option>数据发布</option><option>健康检查</option></select></label><label>账期<select id="month"><option value="">全部月份</option></select></label><label>状态<select id="status"><option value="">全部状态</option><option value="attention">需要关注</option><option value="pending">待采集</option><option value="complete">已成功</option></select></label></section>
<div id="collectors" class="collector-grid"></div>
<p class="collector-footnote">每30秒自动刷新。采集状态与通知读取同一个健康结果；月度项目只有原件校验、导入中台和回读均完成，才显示“全链路完成”。</p>
