<!-- ERP 同步状态 -->

<!-- ERP 订单看板 -->
<div id="erp-app">
  <p class="text-secondary">加载中...</p>
</div>

<script>
// Sync status bar
(async function(){
  const bar = document.getElementById('sync-bar');
  try {
    const r = await fetch('/api/erp/sync-status');
    const s = await r.json();
    const alive = s.process_alive;
    const stale = s.stale;
    const ok = alive && !stale && s.status === 'ok';
    const color = ok ? 'success' : (!alive ? 'danger' : (stale ? 'warning' : 'info'));
    const icon = ok ? 'circle-check' : (!alive ? 'alert-circle' : 'clock');
    const statusText = !alive ? '同步进程未运行' :
      (s.status !== 'ok' ? '同步异常: ' + s.status :
      (stale ? '数据可能过期' : '运行中'));
    const age = s.age_minutes != null ? (s.age_minutes < 1 ? '刚刚' : Math.round(s.age_minutes) + '分钟前') : '未知';

    bar.innerHTML = `
      <div class="alert alert-${color} d-flex align-items-center py-2" role="alert">
        <i class="ti ti-${icon} me-2"></i>
        <div class="flex-fill">
          <strong>ERP 同步</strong>: ${statusText}
          <span class="text-secondary ms-2">|</span>
          <span class="ms-2">最近拉取: ${s.synced_at || '从未'} (${age})</span>
          <span class="text-secondary ms-2">|</span>
          <span class="ms-2">待审核 ${s.pending_count} 单 / 历史 ${s.history_count} 单</span>
          ${alive ? '<span class="text-secondary ms-2">| PID ' + s.process_pid + '</span>' : ''}
        </div>
      </div>
    `;
  } catch(e) {
    bar.innerHTML = '<div class="alert alert-secondary py-2">同步状态获取失败</div>';
  }
})();

document.addEventListener('DOMContentLoaded', async () => {
  const app = document.getElementById('erp-app');
  try {
    const res = await fetch('/api/erp/orders');
    const data = await res.json();
    const orders = data.orders || [];
    const pending = orders.filter(o => o.source === 'pending');
    const history = orders.filter(o => o.source === 'history');

    function badge(status) {
      const map = {
        '已付款': 'bg-warning', '部分发货': 'bg-info',
        '已发货': 'bg-success', '交易成功': 'bg-green',
        '交易关闭': 'bg-secondary', '退款中': 'bg-danger',
      };
      return `<span class="badge ${map[status] || 'bg-secondary'}">${status}</span>`;
    }

    function alertBadge(alert) {
      if (alert === '缺') return '<span class="badge bg-red-lt">缺货</span>';
      if (alert === '退中') return '<span class="badge bg-orange-lt">退款中</span>';
      return '';
    }

    function renderOrderRow(o, showLogistics) {
      const items = o.items || [];
      const itemSummary = items.map(i =>
        `<span class="text-primary">${i.sku || ''}</span>` +
        (i.color ? `/${i.color}` : '') +
        (i.size ? `/${i.size}` : '') +
        ` x${i.qty || 1}`
      ).join(', ') || o.item_summary || '';

      return `
        <tr>
          <td>
            <div class="fw-bold" style="font-size:0.75rem">${o.id || ''}</div>
            <div class="text-secondary small">${o.paid_at || ''}</div>
          </td>
          <td>${badge(o.trade_status || '')} ${alertBadge(o.alert || '')}</td>
          <td><div class="small">${itemSummary}</div></td>
          <td class="fw-bold">&yen;${parseFloat(o.amount || 0).toLocaleString()}</td>
          <td>
            <div>${o.buyer.name || ''}</div>
            <div class="text-secondary small">${o.buyer.province || ''}${o.buyer.city || ''}</div>
          </td>
          ${showLogistics ? `<td class="small">${o.logistics_company || ''}<br/>${o.tracking_no || ''}</td>` : ''}
          <td class="small text-secondary">${o.seller_memo || ''}</td>
        </tr>
      `;
    }

    app.innerHTML = `
      <!-- Tab 切换 -->
      <ul class="nav nav-tabs mb-3" role="tablist">
        <li class="nav-item">
          <a class="nav-link active" data-bs-toggle="tab" href="#tab-pending">
            待审核 <span class="badge bg-red ms-1">${pending.length}</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" data-bs-toggle="tab" href="#tab-history">
            已发货 <span class="badge bg-green ms-1">${history.length}</span>
          </a>
        </li>
      </ul>

      <div class="tab-content">
        <!-- 待审核 -->
        <div class="tab-pane active show" id="tab-pending">
          <div class="card">
            <div class="table-responsive">
              <table class="table table-vcenter table-hover table-sm">
                <thead>
                  <tr>
                    <th style="min-width:160px">订单编号</th>
                    <th>状态</th>
                    <th style="min-width:200px">商品</th>
                    <th>金额</th>
                    <th>买家</th>
                    <th>备注</th>
                  </tr>
                </thead>
                <tbody>
                  ${pending.map(o => renderOrderRow(o, false)).join('')}
                </tbody>
              </table>
            </div>
            <div class="card-footer text-secondary">
              共 ${pending.length} 单，合计 &yen;${pending.reduce((s,o) => s + parseFloat(o.amount||0), 0).toLocaleString()}
            </div>
          </div>
        </div>

        <!-- 已发货 -->
        <div class="tab-pane" id="tab-history">
          <div class="card">
            <div class="table-responsive">
              <table class="table table-vcenter table-hover table-sm">
                <thead>
                  <tr>
                    <th style="min-width:160px">订单编号</th>
                    <th>状态</th>
                    <th style="min-width:200px">商品</th>
                    <th>金额</th>
                    <th>买家</th>
                    <th>物流</th>
                    <th>备注</th>
                  </tr>
                </thead>
                <tbody>
                  ${history.map(o => renderOrderRow(o, true)).join('')}
                </tbody>
              </table>
            </div>
            <div class="card-footer text-secondary">
              共 ${history.length} 单，合计 &yen;${history.reduce((s,o) => s + parseFloat(o.amount||0), 0).toLocaleString()}
            </div>
          </div>
        </div>
      </div>
    `;
  } catch(e) {
    app.innerHTML = '<div class="alert alert-danger">加载失败: '+e.message+'</div>';
  }
});
