<div id="sync-bar-index" class="mb-3"></div>

<!-- 总览 — 各模块状态速览 -->
<div class="row row-deck row-cards" id="overview">
  <div class="col-12">
    <div class="card">
      <div class="card-body">
        <p class="text-secondary">数据加载中...</p>
      </div>
    </div>
  </div>
</div>

<script>
// Sync status bar (same logic as erp page)
(async function(){
  const bar = document.getElementById('sync-bar-index');
  try {
    const r = await fetch('/api/erp/sync-status');
    const s = await r.json();
    const alive = s.process_alive;
    const stale = s.stale;
    const ok = alive && !stale && s.status === 'ok';
    const color = ok ? 'success' : (!alive ? 'danger' : (stale ? 'warning' : 'info'));
    const icon = ok ? 'circle-check' : (!alive ? 'alert-circle' : 'clock');
    const statusText = !alive ? '同步进程未运行' :
      (s.status !== 'ok' ? '同步异常: ' + s.status :
      (stale ? '数据可能过期' : '运行中'));
    const age = s.age_minutes != null ? (s.age_minutes < 1 ? '刚刚' : Math.round(s.age_minutes) + '分钟前') : '未知';
    bar.innerHTML = `
      <div class="alert alert-${color} d-flex align-items-center py-2" role="alert">
        <i class="ti ti-${icon} me-2"></i>
        <div class="flex-fill">
          <strong>ERP 同步</strong>: ${statusText}
          <span class="text-secondary ms-2">|</span>
          <span class="ms-2">最近拉取: ${s.synced_at || '从未'} (${age})</span>
          <span class="text-secondary ms-2">|</span>
          <span class="ms-2">待审核 ${s.pending_count} / 历史 ${s.history_count}</span>
        </div>
      </div>`;
  } catch(e) {}
})();

document.addEventListener('DOMContentLoaded', async () => {
  try {
    // Keep the ERP overview responsive when an optional analytics endpoint is slow.
    // The original cards remain unchanged; SYCM and inventory fill in as they arrive.
    const fetchJson = (url, timeoutMs = 8000) => {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      return fetch(url, {signal: controller.signal})
        .then(r => r.ok ? r.json() : null)
        .catch(() => null)
        .finally(() => clearTimeout(timer));
    };
    const sycmPromise = fetchJson('/api/sycm/overview');
    const inventoryPromise = fetchJson('/api/erp/inventory/summary');
    const erpRes = await fetch('/api/erp/stats', {signal: AbortSignal.timeout(8000)});
    const s = erpRes.ok ? await erpRes.json() : null;
    const sycm = null;
    const inventory = null;

    if (!s) { document.getElementById('overview').innerHTML = '<div class="alert alert-warning">无法加载数据</div>'; return; }

    const renderSycmCard = (data) => {
      const current = data ? (data.current_month || {
        ...data.current,
        date: data.range ? data.range.end : ''
      }) : null;
      return current ? `
      <div id="overview-sycm-card" class="col-sm-6 col-lg-3">
        <a href="/jun-pages/sycm/" class="card card-link card-link-pop" style="border-left:4px solid #206bc4">
          <div class="card-body text-center py-4">
            <i class="ti ti-chart-bar mb-2" style="font-size:2rem"></i>
            <div class="fw-bold">生意参谋</div>
            <div class="small text-secondary">${current.date ? current.date.slice(0,7) : ''}</div>
            <div class="mt-1">
              <span class="fw-bold">&yen;${Number(current.pay_amount).toLocaleString('zh-CN', {maximumFractionDigits:0})}</span>
              <span class="text-secondary ms-2">${Number(current.visitors).toLocaleString()} 访客</span>
            </div>
          </div>
        </a>
      </div>` : `
      <div id="overview-sycm-card" class="col-sm-6 col-lg-3">
        <div class="card bg-secondary-lt">
          <div class="card-body text-center py-4 text-muted">
            <i class="ti ti-chart-bar mb-2" style="font-size:2rem"></i>
            <div class="fw-bold">生意参谋</div>
            <div class="small">数据未就绪</div>
          </div>
        </div>
      </div>`;
    };

    const renderInventoryCard = (data) => data && data.ready ? `
      <div id="overview-inventory-card" class="col-sm-6 col-lg-3">
        <a href="/jun-pages/inventory/" class="card card-link card-link-pop" style="border-left:4px solid #f59f00">
          <div class="card-body text-center py-4">
            <i class="ti ti-building-warehouse mb-2" style="font-size:2rem"></i>
            <div class="fw-bold">库存明细</div>
            <div class="small text-secondary">${data.month}</div>
            <div class="mt-1">
              <span class="fw-bold">${Number(data.summary.closing_qty).toLocaleString('zh-CN', {maximumFractionDigits:1})} 件</span>
              <span class="${data.summary.net_change_qty > 0 ? 'text-danger' : 'text-success'} ms-2">
                ${data.summary.net_change_qty > 0 ? '+' : ''}${Number(data.summary.net_change_qty).toLocaleString('zh-CN', {maximumFractionDigits:1})}
              </span>
            </div>
          </div>
        </a>
      </div>` : `
      <div id="overview-inventory-card" class="col-sm-6 col-lg-3">
        <a href="/jun-pages/inventory/" class="card bg-secondary-lt">
          <div class="card-body text-center py-4 text-muted">
            <i class="ti ti-building-warehouse mb-2" style="font-size:2rem"></i>
            <div class="fw-bold">库存明细</div>
            <div class="small">数据未就绪</div>
          </div>
        </a>
      </div>`;

    document.getElementById('overview').innerHTML = `
      <!-- ERP 概览卡片 -->
      <div class="col-sm-6 col-lg-3">
        <div class="card stat-card">
          <div class="card-body">
            <div class="d-flex align-items-center">
              <div class="subheader">待审核订单</div>
            </div>
            <div class="h1 mb-0">${s.pending_count}</div>
            <div class="text-secondary mt-1">合计 &yen;${s.pending_amount.toLocaleString()}</div>
          </div>
        </div>
      </div>
      <div class="col-sm-6 col-lg-3">
        <div class="card stat-card">
          <div class="card-body">
            <div class="subheader">缺货订单</div>
            <div class="h1 mb-0 ${s.out_of_stock > 0 ? 'text-danger' : ''}">${s.out_of_stock}</div>
            <div class="text-secondary mt-1">占待审核 ${s.pending_count > 0 ? Math.round(s.out_of_stock/s.pending_count*100) : 0}%</div>
          </div>
        </div>
      </div>
      <div class="col-sm-6 col-lg-3">
        <div class="card stat-card">
          <div class="card-body">
            <div class="subheader">已发货 (近30天)</div>
            <div class="h1 mb-0">${s.history_count}</div>
            <div class="text-secondary mt-1">合计 &yen;${s.history_amount.toLocaleString()}</div>
          </div>
        </div>
      </div>
      <div class="col-sm-6 col-lg-3">
        <div class="card stat-card">
          <div class="card-body">
            <div class="subheader">SKU 品种数</div>
            <div class="h1 mb-0">${Object.keys(s.sku_breakdown).length}</div>
            <div class="text-secondary mt-1">总件数 ${Object.values(s.sku_breakdown).reduce((a,b)=>a+b, 0)}</div>
          </div>
        </div>
      </div>

      <!-- 模块入口 -->
      <div class="col-12 mt-3">
        <div class="card">
          <div class="card-header"><h3 class="card-title">运营模块</h3></div>
          <div class="card-body">
            <div class="row g-3">
              <div class="col-sm-6 col-lg-3">
                <a href="/jun-pages/erp/" class="card card-link card-link-pop">
                  <div class="card-body text-center py-4">
                    <i class="ti ti-package mb-2" style="font-size:2rem"></i>
                    <div class="fw-bold">ERP 订单</div>
                    <div class="text-secondary small">${s.pending_count} 待审核</div>
                  </div>
                </a>
              </div>
              ${renderSycmCard(sycm)}
              ${renderInventoryCard(inventory)}
              <div class="col-sm-6 col-lg-3">
                <div class="card bg-secondary-lt">
                  <div class="card-body text-center py-4 text-muted">
                    <i class="ti ti-speakerphone mb-2" style="font-size:2rem"></i>
                    <div class="fw-bold">万相台推广</div>
                    <div class="small">即将上线</div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- SKU 分布 -->
      <div class="col-lg-6 mt-3">
        <div class="card">
          <div class="card-header"><h3 class="card-title">待发货 SKU 分布</h3></div>
          <div class="card-body">
            <div class="table-responsive">
              <table class="table table-vcenter table-sm">
                <thead><tr><th>SKU</th><th>数量</th><th></th></tr></thead>
                <tbody>
                  ${Object.entries(s.sku_breakdown).map(([sku, cnt]) => {
                    const max = Math.max(...Object.values(s.sku_breakdown));
                    const pct = Math.round(cnt/max*100);
                    return '<tr><td class="fw-bold">'+sku+'</td><td>'+cnt+'</td><td style="width:50%"><div class="progress progress-sm"><div class="progress-bar bg-primary" style="width:'+pct+'%"></div></div></td></tr>';
                  }).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

      <!-- 地区分布 -->
      <div class="col-lg-6 mt-3">
        <div class="card">
          <div class="card-header"><h3 class="card-title">待发货地区分布</h3></div>
          <div class="card-body">
            <div class="table-responsive">
              <table class="table table-vcenter table-sm">
                <thead><tr><th>省份</th><th>订单数</th><th></th></tr></thead>
                <tbody>
                  ${Object.entries(s.province_distribution).map(([prov, cnt]) => {
                    const max = Math.max(...Object.values(s.province_distribution));
                    const pct = Math.round(cnt/max*100);
                    return '<tr><td>'+prov+'</td><td>'+cnt+'</td><td style="width:50%"><div class="progress progress-sm"><div class="progress-bar bg-azure" style="width:'+pct+'%"></div></div></td></tr>';
                  }).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    `;

    // Optional cards update independently; a slow SYCM/inventory response no longer
    // holds the complete overview hostage.
    Promise.all([sycmPromise, inventoryPromise]).then(([nextSycm, nextInventory]) => {
      const sycmNode = document.getElementById('overview-sycm-card');
      const inventoryNode = document.getElementById('overview-inventory-card');
      if (sycmNode) sycmNode.outerHTML = renderSycmCard(nextSycm);
      if (inventoryNode) inventoryNode.outerHTML = renderInventoryCard(nextInventory);
    });
  } catch(e) {
    document.getElementById('overview').innerHTML = '<div class="alert alert-danger">加载失败: '+e.message+'</div>';
  }
});
</script>

        </div>
      </div>
    </div>

  </div>

  <!-- Mobile bottom tab bar -->
  <nav class="bottom-tab-bar">
    <div class="tab-items">
      <a href="/jun-pages/" class="tab-item active">
        <i class="ti ti-dashboard"></i>
        <span>运营</span>
      </a>
      <a href="/jun-pages/erp/" class="tab-item ">
        <i class="ti ti-clipboard-check"></i>
        <span>审核</span>
      </a>
      <a href="/jun-pages/inventory/" class="tab-item ">
        <i class="ti ti-building-warehouse"></i>
        <span>库存</span>
      </a>
      <a href="/jun-pages/production/" class="tab-item">
        <i class="ti ti-building-factory-2"></i>
        <span>生产</span>
      </a>
    </div>
  </nav>

  <script src="/jun-pages/vendor/tabler.min.js"></script>
