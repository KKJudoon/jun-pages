      <!-- Page body -->
      <div class="page-body">
        <div class="container-xl">
          <main id="overview" aria-label="模块导航"></main>
          <script>
          window.JUN_AUTH_READY.then(ready => {
            if (!ready) return;
            const workspace = window.JUN_WORKSPACE;
            const visible = workspace.visiblePages(ready.context).filter(page => page.path !== '/' && !page.parent);
            const base = window.JUN_CONFIG.pagesBasePath.replace(/\/$/, '');
            const escape = value => String(value).replace(/[&<>"']/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character]));
            document.getElementById('overview').innerHTML = workspace.areas.map(area => {
              const modules = visible.filter(page => page.area === area.id);
              if (!modules.length) return '';
              return `<section class="module-section" aria-label="${escape(area.name)}">
                <h3 class="module-heading">${escape(area.name)}</h3>
                <div class="module-grid">${modules.map(page => `<a class="card module-link" href="${base}${page.path}"><i class="ti ti-${escape(page.icon)}" aria-hidden="true"></i><span>${escape(page.name)}</span><i class="ti ti-chevron-right module-arrow" aria-hidden="true"></i></a>`).join('')}</div>
              </section>`;
            }).join('');
          });
          </script>

        </div>
