<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>生产记工表 — 生意中台</title>
  <link rel="stylesheet" href="/jun-pages/vendor/tabler.min.css"/>
  <link rel="stylesheet" href="/jun-pages/vendor/tabler-icons.min.css"/>
  <style>
    :root { --production-border:#dfe3e8; --production-muted:#667085; --production-pending:#f59f00; }
    .nav-link.active { background:rgba(32,107,196,.15)!important; font-weight:600; border-left:3px solid #206bc4; }
    .nav-section-label { padding:.9rem 1rem .3rem; color:rgba(255,255,255,.48); font-size:.68rem; font-weight:700; }
    .production-head { display:flex; align-items:end; justify-content:space-between; gap:1rem; flex-wrap:wrap; }
    .production-month-control { display:flex; align-items:end; gap:.55rem; flex-wrap:wrap; }
    .production-month-control .form-select { width:9rem; }
    .production-status { min-width:4.5rem; text-align:center; }
    .production-kpis { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); border:1px solid var(--production-border); border-radius:6px; background:#fff; }
    .production-kpi { min-width:0; padding:.8rem 1rem; border-right:1px solid var(--production-border); }
    .production-kpi:last-child { border-right:0; }
    .production-kpi-label { color:var(--production-muted); font-size:.72rem; }
    .production-kpi-value { margin-top:.18rem; overflow-wrap:anywhere; font-size:1.2rem; line-height:1.25; font-weight:700; font-variant-numeric:tabular-nums; }
    .production-toolbar { display:flex; align-items:end; gap:.6rem; flex-wrap:wrap; padding:.85rem 0; border-bottom:1px solid var(--production-border); }
    .production-search { flex:1 1 15rem; min-width:12rem; }
    .production-filter { flex:0 1 10rem; min-width:8rem; }
    .production-actions { display:flex; gap:.45rem; margin-left:auto; flex-wrap:wrap; }
    .production-view-switch { display:inline-grid; grid-template-columns:repeat(4,auto); padding:3px; border:1px solid var(--production-border); border-radius:5px; background:#f4f6f8; }
    .production-view-switch .btn { min-width:6.8rem; border:0; }
    .production-view-switch .btn.active { color:#fff; background:#206bc4; }
    .production-table-wrap { overflow:auto; border:1px solid var(--production-border); border-radius:6px; background:#fff; }
    .production-table { min-width:1210px; margin:0; }
    .production-table th { position:sticky; top:0; z-index:1; padding:.55rem .65rem; white-space:nowrap; background:#f7f8fa; }
    .production-table td { padding:.52rem .65rem; vertical-align:middle; }
    .production-table tbody tr.is-excluded { background:#fff8f7; }
    .production-table tbody tr.is-changed { box-shadow:inset 3px 0 #206bc4; }
    .production-table tbody tr.is-pending { box-shadow:inset 4px 0 var(--production-pending); background:#fffaf0; }
    .production-code { min-width:7rem; font-weight:600; }
    .production-number { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
    .production-empty { padding:3rem 1rem; color:var(--production-muted); text-align:center; }
    .production-section { min-width:0; border:1px solid var(--production-border); border-radius:6px; background:#fff; }
    .production-section + .production-section { margin-top:1rem; }
    .production-section-head { display:flex; align-items:center; justify-content:space-between; gap:.75rem; padding:.72rem .9rem; border-bottom:1px solid var(--production-border); }
    .production-section-title { margin:0; font-size:.92rem; font-weight:700; }
    .production-section .table { margin:0; }
    .production-summary-grid { display:grid; grid-template-columns:minmax(0,1.2fr) minmax(18rem,.8fr); gap:1rem; }
    .production-stat-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:.75rem; margin-bottom:1rem; }
    .production-stat { padding:.78rem .9rem; border:1px solid var(--production-border); border-radius:6px; background:#fff; }
    .production-stat strong { display:block; margin-top:.12rem; font-size:1.18rem; font-variant-numeric:tabular-nums; }
    .production-request-list { border:1px solid var(--production-border); border-radius:6px; background:#fff; }
    .production-request { display:grid; grid-template-columns:minmax(13rem,1.15fr) minmax(12rem,1fr) minmax(10rem,.8fr) auto; gap:1rem; align-items:center; padding:.85rem 1rem; border-bottom:1px solid var(--production-border); }
    .production-request:last-child { border-bottom:0; }
    .production-request-title { display:flex; align-items:center; gap:.45rem; flex-wrap:wrap; font-weight:700; }
    .production-request-meta { margin-top:.24rem; color:var(--production-muted); font-size:.75rem; }
    .production-request-reason { font-weight:600; }
    .production-chips { display:flex; gap:.3rem; flex-wrap:wrap; margin-top:.35rem; }
    .production-chip { padding:.14rem .4rem; border:1px solid #d8dde5; border-radius:4px; color:#475467; background:#f8f9fb; font-size:.69rem; }
    .production-formula { display:block; margin-top:.12rem; color:var(--production-muted); font-size:.7rem; line-height:1.35; }
    .production-profit { font-size:1.4rem; font-weight:700; font-variant-numeric:tabular-nums; }
    .production-dialog { width:min(95vw,920px); max-height:92vh; padding:0; border:0; border-radius:6px; box-shadow:0 24px 70px rgba(17,24,39,.28); }
    .production-dialog-sm { width:min(95vw,720px); }
    .production-dialog::backdrop { background:rgba(17,24,39,.58); }
    .production-dialog form, .production-dialog-shell { display:flex; max-height:92vh; margin:0; flex-direction:column; }
    .production-dialog-head { display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:.85rem 1rem; border-bottom:1px solid var(--production-border); }
    .production-dialog-body { min-height:0; padding:1rem; overflow:auto; }
    .production-dialog-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:.8rem; }
    .production-span-2 { grid-column:span 2; }
    .production-span-4 { grid-column:span 4; }
    .production-dialog-actions { display:flex; justify-content:flex-end; gap:.5rem; padding:.85rem 1rem; border-top:1px solid var(--production-border); }
    .production-original { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:.55rem; margin-bottom:1rem; padding:.75rem; border:1px solid #dce6f5; border-radius:6px; background:#f5f8fc; }
    .production-original-item span { display:block; color:var(--production-muted); font-size:.68rem; }
    .production-original-item strong { display:block; margin-top:.1rem; overflow-wrap:anywhere; font-size:.82rem; }
    .production-field-picker { display:flex; gap:.4rem; flex-wrap:wrap; }
    .production-field-picker label { position:relative; }
    .production-field-picker input { position:absolute; opacity:0; pointer-events:none; }
    .production-field-picker span { display:block; padding:.35rem .55rem; border:1px solid #d8dde5; border-radius:5px; background:#fff; cursor:pointer; font-size:.75rem; }
    .production-field-picker input:checked + span { border-color:#206bc4; color:#165ea8; background:#eaf2fc; font-weight:600; }
    .production-diff { width:100%; border-collapse:collapse; }
    .production-diff th, .production-diff td { padding:.5rem .55rem; border-bottom:1px solid var(--production-border); text-align:left; vertical-align:top; }
    .production-diff th { width:9rem; color:var(--production-muted); font-size:.72rem; }
    .production-diff td { overflow-wrap:anywhere; }
    .production-alert { min-height:22px; margin:.5rem 0 0; }
    .bottom-tab-bar { display:none; position:fixed; right:0; bottom:0; left:0; z-index:1050; padding:4px 0 env(safe-area-inset-bottom,4px); border-top:1px solid #e6e8eb; background:#fff; }
    .bottom-tab-bar .tab-items { display:flex; align-items:center; justify-content:space-around; }
    .bottom-tab-bar .tab-item { display:flex; min-width:0; flex-direction:column; align-items:center; padding:4px 5px; color:#667; font-size:.68rem; text-decoration:none; }
    .bottom-tab-bar .tab-item i { margin-bottom:2px; font-size:1.25rem; }
    .bottom-tab-bar .tab-item.active { color:#206bc4; font-weight:600; }
    @media (max-width:991px) {
      .bottom-tab-bar { display:block; }
      .page-body { padding-bottom:76px; }
      .production-kpis { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .production-kpi { border-bottom:1px solid var(--production-border); }
      .production-kpi:nth-child(2n) { border-right:0; }
      .production-kpi:last-child { grid-column:span 2; border-bottom:0; }
      .production-summary-grid { grid-template-columns:1fr; }
      .production-request { grid-template-columns:1fr 1fr auto; }
      .production-request > :nth-child(2) { grid-column:span 2; }
    }
    @media (max-width:575px) {
      .production-head { align-items:stretch; }
      .production-month-control { width:100%; align-items:end; }
      .production-month-control label { flex:1 1 auto; }
      .production-month-control .form-select { width:100%; }
      .production-status { display:inline-flex; min-height:40px; align-items:center; justify-content:center; }
      .production-view-switch { width:100%; grid-template-columns:repeat(4,1fr); }
      .production-view-switch .btn { min-width:0; padding:.4rem .25rem; font-size:.72rem; }
      .production-search { flex-basis:100%; }
      .production-filter { flex:1 1 calc(50% - .4rem); }
      .production-actions { width:100%; margin-left:0; }
      .production-actions .btn { flex:1 1 auto; }
      .production-stat-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .production-request { grid-template-columns:1fr; gap:.6rem; }
      .production-request > :nth-child(2) { grid-column:auto; }
      .production-dialog-grid, .production-original { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .production-span-4 { grid-column:span 2; }
      .production-dialog-actions { flex-wrap:wrap; }
      .production-dialog-actions .btn { flex:1 1 auto; }
    }
  </style>
  <link rel="stylesheet" href="/jun-pages/auth-gate.css">
  <link rel="icon" type="image/png" sizes="32x32" href="/jun-pages/assets/jun-icon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/jun-pages/assets/jun-icon-180.png">
  <link rel="manifest" href="/jun-pages/manifest.webmanifest">
  <meta name="theme-color" content="#101b3d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="/jun-pages/vendor/supabase.js"></script>
  <script src="/jun-pages/config.js?v=20260808-1"></script>
  <script src="/jun-pages/device.js"></script>
  <script src="/jun-pages/public-bridge.js?v=20260808-1"></script>
</head>
<body class="layout-fluid">
  <div class="page">
    <aside class="navbar navbar-vertical navbar-expand-lg" data-bs-theme="dark">
      <div class="container-fluid">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#sidebar-menu"><span class="navbar-toggler-icon"></span></button>
        <h1 class="navbar-brand navbar-brand-autodark"><a href="/jun-pages/" style="text-decoration:none;color:inherit"><span class="ms-2">生意中台</span></a></h1>
        <div class="collapse navbar-collapse" id="sidebar-menu">
          <ul class="navbar-nav pt-lg-3">
            <li class="nav-section-label">生意中台 · ERP</li>
            <li class="nav-item"><a class="nav-link" href="/jun-pages/erp/"><span class="nav-link-icon"><i class="ti ti-clipboard-check"></i></span><span class="nav-link-title">订单审核</span></a></li>
            <li class="nav-item"><a class="nav-link" href="/jun-pages/erp/products/"><span class="nav-link-icon"><i class="ti ti-shirt"></i></span><span class="nav-link-title">商品档案</span></a></li>
            <li class="nav-item"><a class="nav-link" href="/jun-pages/inventory/"><span class="nav-link-icon"><i class="ti ti-building-warehouse"></i></span><span class="nav-link-title">库存明细</span></a></li>
            <li class="nav-section-label">生意中台 · 生产</li>
            <li class="nav-item"><a class="nav-link active" href="/jun-pages/production/"><span class="nav-link-icon"><i class="ti ti-building-factory-2"></i></span><span class="nav-link-title">生产记工</span></a></li>
            <li class="nav-section-label">生意中台 · 电商运营</li>
            <li class="nav-item"><a class="nav-link" href="/jun-pages/"><span class="nav-link-icon"><i class="ti ti-dashboard"></i></span><span class="nav-link-title">运营总览</span></a></li>
            <li class="nav-item"><a class="nav-link" href="/jun-pages/sycm/"><span class="nav-link-icon"><i class="ti ti-chart-bar"></i></span><span class="nav-link-title">生意参谋</span></a></li>
            <li class="nav-item"><a class="nav-link" href="/jun-pages/marketing-safety/"><span class="nav-link-icon"><i class="ti ti-shield-exclamation"></i></span><span class="nav-link-title">营销安全</span></a></li>
          </ul>
        </div>
      </div>
    </aside>

    <div class="page-wrapper">
      <div class="page-header d-print-none">
        <div class="container-xl production-head">
          <div><div class="page-pretitle">生意中台 · 生产</div><h2 class="page-title">生产记工表</h2></div>
          <div class="production-month-control">
            <label><span class="form-label">月份</span><select id="production-month" class="form-select" aria-label="月份"></select></label>
            <span id="production-status" class="badge production-status">未同步</span>
            <button id="production-reopen" class="btn btn-outline-danger" type="button" hidden><i class="ti ti-lock-open me-1"></i>重新打开</button>
          </div>
        </div>
      </div>

      <div class="page-body">
        <div class="container-xl">
          <div id="production-kpis" class="production-kpis" aria-live="polite"></div>
          <div class="production-toolbar">
            <div class="production-view-switch" role="tablist" aria-label="生产记工视图">
              <button class="btn btn-sm active" type="button" data-production-view="lines"><i class="ti ti-list-details me-1"></i>记工</button>
              <button class="btn btn-sm" type="button" data-production-view="requests"><i class="ti ti-checklist me-1"></i>审批</button>
              <button class="btn btn-sm" type="button" data-production-view="wages"><i class="ti ti-users me-1"></i>工资</button>
              <button class="btn btn-sm" type="button" data-production-view="finance"><i class="ti ti-calculator me-1"></i>收支</button>
            </div>
            <label class="production-search" data-production-line-filter><span class="form-label">搜索</span><div class="input-icon"><span class="input-icon-addon"><i class="ti ti-search"></i></span><input id="production-search" class="form-control" type="search" placeholder="款号、往来单位、申请编号"/></div></label>
            <label class="production-filter" data-production-lines-only><span class="form-label">往来单位</span><select id="production-worker" class="form-select"><option value="">全部</option></select></label>
            <label class="production-filter" data-production-request-filter hidden><span class="form-label">申请状态</span><select id="production-request-filter" class="form-select"><option value="">全部</option><option value="pending">待审批</option><option value="approved">已批准</option><option value="rejected">已驳回</option><option value="cancelled">已撤回</option></select></label>
            <div class="production-actions">
              <button id="production-export" class="btn btn-outline-secondary" type="button"><i class="ti ti-download me-1"></i>导出</button>
              <button id="production-finance-edit" class="btn btn-outline-primary" type="button" hidden><i class="ti ti-adjustments me-1"></i>核算参数</button>
              <button id="production-add" class="btn btn-primary" type="button" hidden><i class="ti ti-plus me-1"></i>新增计工申请</button>
              <button id="production-finalize" class="btn btn-outline-primary" type="button" hidden><i class="ti ti-lock-check me-1"></i>定稿</button>
            </div>
          </div>
          <div id="production-alert" class="production-alert" role="status"></div>
          <section id="production-lines-view"></section>
          <section id="production-requests-view" hidden></section>
          <section id="production-wages-view" hidden></section>
          <section id="production-finance-view" hidden></section>
        </div>
      </div>
    </div>
  </div>

  <dialog id="production-request-editor" class="production-dialog">
    <form id="production-request-form">
      <div class="production-dialog-head"><div><h3 id="production-editor-title" class="m-0 fs-3">提交调整申请</h3><div id="production-editor-source" class="text-secondary small"></div></div><button class="btn-close" type="button" data-production-close="production-request-editor" aria-label="关闭"></button></div>
      <div class="production-dialog-body">
        <div id="production-original" class="production-original"></div>
        <div class="production-dialog-grid">
          <label class="production-span-2"><span class="form-label">申请原因</span><select name="reason_code" class="form-select" required></select></label>
          <label class="production-span-2"><span class="form-label">原因说明</span><textarea name="reason_detail" class="form-control" rows="2" maxlength="1000" required></textarea></label>
          <div id="production-field-picker-wrap" class="production-span-4"><span class="form-label">调整内容</span><div id="production-field-picker" class="production-field-picker"></div></div>
          <label data-production-value="work_date"><span class="form-label">日期</span><input name="work_date" class="form-control" type="date" required/></label>
          <label data-production-value="product_code"><span class="form-label">商品编号/计工内容</span><input name="product_code" class="form-control" maxlength="120" required/></label>
          <label data-production-value="color"><span class="form-label">颜色</span><input name="color" class="form-control" maxlength="80"/></label>
          <label data-production-value="size"><span class="form-label">尺码</span><input name="size" class="form-control" maxlength="80"/></label>
          <label data-production-value="quantity"><span class="form-label">数量</span><input name="quantity" class="form-control production-number" type="number" min="0.01" step="0.01" required/></label>
          <label data-production-value="unit_price"><span class="form-label">单价</span><input name="unit_price" class="form-control production-number" type="number" min="0" step="0.01" required/></label>
          <label data-production-value="supplement"><span class="form-label">补价总额</span><input name="supplement" class="form-control production-number" type="number" step="0.01" value="0"/></label>
          <label data-production-value="worker_name"><span class="form-label">往来单位</span><input name="worker_name" class="form-control" maxlength="120" required/></label>
          <label data-production-value="work_type"><span class="form-label">类型</span><select name="work_type" class="form-select" required><option>大货</option><option>修改</option><option>样衣</option><option>配件</option><option>走秀衣</option><option>外接</option><option>外加工</option><option>杂活</option></select></label>
          <label data-production-value="value_attribution"><span class="form-label">产值归属</span><select name="value_attribution" class="form-select" required><option>内部产值</option><option>内部样衣产值</option><option>外加工产值</option><option>外发货值</option></select></label>
          <label data-production-value="cutting_type"><span class="form-label">裁床</span><select name="cutting_type" class="form-select" required><option>内部裁剪</option><option>不涉及裁床</option></select></label>
          <label class="production-span-2" data-production-value="note"><span class="form-label">计工备注</span><input name="line_note" class="form-control" maxlength="500"/></label>
          <label class="production-span-2" data-production-value="exclusion_reason"><span class="form-label">不计入原因</span><input name="exclusion_reason" class="form-control" maxlength="300"/></label>
          <label class="production-span-4 form-check form-switch" data-production-value="include_in_payroll"><input name="include_in_payroll" class="form-check-input" type="checkbox" checked/><span class="form-check-label">计入工钱与产值</span></label>
          <label class="production-span-4"><span class="form-label">申请备注</span><textarea name="request_note" class="form-control" rows="2" maxlength="1000"></textarea></label>
          <div class="production-span-4 alert alert-info py-2 mb-0"><span class="text-secondary small">申请后金额</span><strong id="production-proposed-amount" class="ms-2">¥0.00</strong></div>
        </div>
        <div id="production-form-error" class="text-danger small mt-3" role="alert"></div>
      </div>
      <div class="production-dialog-actions"><button class="btn btn-outline-secondary" type="button" data-production-close="production-request-editor">取消</button><button id="production-request-submit" class="btn btn-primary" type="submit"><i class="ti ti-send me-1"></i>提交审批</button></div>
    </form>
  </dialog>

  <dialog id="production-request-detail" class="production-dialog production-dialog-sm">
    <div class="production-dialog-shell">
      <div class="production-dialog-head"><div><h3 id="production-detail-title" class="m-0 fs-3">审批详情</h3><div id="production-detail-meta" class="text-secondary small"></div></div><button class="btn-close" type="button" data-production-close="production-request-detail" aria-label="关闭"></button></div>
      <div class="production-dialog-body"><div id="production-detail-body"></div><label id="production-review-note-wrap" class="mt-3"><span class="form-label">审批意见</span><textarea id="production-review-note" class="form-control" rows="3" maxlength="1000"></textarea></label><div id="production-review-error" class="text-danger small mt-2"></div></div>
      <div class="production-dialog-actions"><button id="production-cancel-request" class="btn btn-outline-secondary me-auto" type="button" hidden><i class="ti ti-arrow-back-up me-1"></i>撤回申请</button><button class="btn btn-outline-secondary" type="button" data-production-close="production-request-detail">关闭</button><button id="production-reject-request" class="btn btn-outline-danger" type="button" hidden><i class="ti ti-x me-1"></i>驳回</button><button id="production-approve-request" class="btn btn-success" type="button" hidden><i class="ti ti-check me-1"></i>批准并生效</button></div>
    </div>
  </dialog>

  <dialog id="production-finance-dialog" class="production-dialog">
    <form id="production-finance-form">
      <div class="production-dialog-head"><div><h3 class="m-0 fs-3">工厂核算参数</h3><div class="text-secondary small">月度输入与固定比例</div></div><button class="btn-close" type="button" data-production-close="production-finance-dialog" aria-label="关闭"></button></div>
      <div class="production-dialog-body">
        <div class="production-dialog-grid">
          <label><span class="form-label">内部产值收入倍率</span><input name="internal_value_multiplier" class="form-control production-number" type="number" min="0" max="10" step="0.01" required/></label>
          <label><span class="form-label">样衣收入倍率</span><input name="sample_value_multiplier" class="form-control production-number" type="number" min="0" max="10" step="0.01" required/></label>
          <label><span class="form-label">裁剪管理比例</span><input name="cutting_rate" class="form-control production-number" type="number" min="0" max="1" step="0.01" required/></label>
          <label><span class="form-label">样衣裁剪单价</span><input name="sample_cutting_rate" class="form-control production-number" type="number" min="0" max="10" step="0.01" required/></label>
          <label><span class="form-label">制作管理比例</span><input name="production_management_rate" class="form-control production-number" type="number" min="0" max="1" step="0.01" required/></label>
          <label><span class="form-label">盈利分成比例</span><input name="positive_profit_share_rate" class="form-control production-number" type="number" min="0" max="1" step="0.01" required/></label>
          <label><span class="form-label">亏损分担比例</span><input name="negative_profit_share_rate" class="form-control production-number" type="number" min="0" max="1" step="0.01" required/></label>
          <label><span class="form-label">外发货值分成</span><input name="external_value_share_rate" class="form-control production-number" type="number" min="0" max="1" step="0.01" required/></label>
          <label><span class="form-label">外加工收入</span><input name="external_processing_income" class="form-control production-number" type="number" min="0" step="0.01" required/></label>
          <label><span class="form-label">额外裁剪费用</span><input name="external_cutting_cost" class="form-control production-number" type="number" min="0" step="0.01" required/></label>
          <label><span class="form-label">工厂房租水电（预估）</span><input name="rent_utilities_estimate" class="form-control production-number" type="number" min="0" step="0.01" required/></label>
          <label><span class="form-label">其他费用</span><input name="other_expenses" class="form-control production-number" type="number" min="0" step="0.01" required/></label>
          <label><span class="form-label">冲抵金额</span><input name="offset_amount" class="form-control production-number" type="number" min="0" step="0.01" required/></label>
          <label><span class="form-label">剑锋个人医社保扣除</span><input name="jianfeng_social_deduction" class="form-control production-number" type="number" min="0" step="0.01" required/></label>
          <label><span class="form-label">手工费用代发</span><input name="jianfeng_manual_payment" class="form-control production-number" type="number" min="0" step="0.01" required/></label>
          <label><span class="form-label">剑锋其他调整</span><input name="jianfeng_other" class="form-control production-number" type="number" step="0.01" required/></label>
          <label class="production-span-4"><span class="form-label">核算备注</span><textarea name="note" class="form-control" rows="3" maxlength="1000"></textarea></label>
        </div>
        <div id="production-finance-error" class="text-danger small mt-3"></div>
      </div>
      <div class="production-dialog-actions"><button class="btn btn-outline-secondary" type="button" data-production-close="production-finance-dialog">取消</button><button id="production-finance-save" class="btn btn-primary" type="submit"><i class="ti ti-device-floppy me-1"></i>保存参数</button></div>
    </form>
  </dialog>

  <nav class="bottom-tab-bar"><div class="tab-items"><a href="/jun-pages/" class="tab-item"><i class="ti ti-dashboard"></i><span>运营</span></a><a href="/jun-pages/erp/" class="tab-item"><i class="ti ti-clipboard-check"></i><span>审核</span></a><a href="/jun-pages/erp/products/" class="tab-item"><i class="ti ti-shirt"></i><span>档案</span></a><a href="/jun-pages/inventory/" class="tab-item"><i class="ti ti-building-warehouse"></i><span>库存</span></a><a href="/jun-pages/production/" class="tab-item active"><i class="ti ti-building-factory-2"></i><span>生产</span></a></div></nav>

  <script src="/jun-pages/vendor/tabler.min.js"></script>
  <script>
  const productionState={months:[],data:null,view:'lines',search:'',worker:'',requestStatus:'',editingLine:null,detailRequest:null};
  const productionStatusLabels={open:['编辑中','bg-blue-lt'],finalized:['已定稿','bg-orange-lt'],verified:['已核验','bg-green-lt']};
  const productionRequestLabels={pending:['待审批','bg-yellow-lt'],approved:['已批准','bg-green-lt'],rejected:['已驳回','bg-red-lt'],cancelled:['已撤回','bg-secondary-lt'],not_required:['原始记录','bg-secondary-lt']};
  const productionReasonConfig={
    price_correction:{label:'工价修正',fields:['unit_price']},quantity_correction:{label:'数量修正',fields:['quantity']},counterparty_correction:{label:'往来单位修正',fields:['worker_name']},
    production_attribute:{label:'生产属性调整',fields:['work_type','value_attribution','cutting_type']},basic_info_correction:{label:'基础资料修正',fields:['work_date','product_code','color','size']},
    supplement:{label:'补价调整',fields:['supplement']},payroll_inclusion:{label:'计入/排除调整',fields:['include_in_payroll','exclusion_reason']},manual_addition:{label:'新增计工',fields:[]},other:{label:'其他调整',fields:['note']},legacy_import:{label:'历史审批迁入',fields:[]}
  };
  const productionFieldLabels={work_date:'日期',product_code:'商品编号/计工内容',color:'颜色',size:'尺码',quantity:'数量',unit_price:'单价',supplement:'补价总额',worker_name:'往来单位',work_type:'类型',value_attribution:'产值归属',cutting_type:'裁床',include_in_payroll:'计入工钱与产值',exclusion_reason:'不计入原因',note:'计工备注'};
  const productionEditableFields=Object.keys(productionFieldLabels);
  const productionNumericFields=new Set(['quantity','unit_price','supplement']);
  const productionFinanceFields=['internal_value_multiplier','sample_value_multiplier','cutting_rate','sample_cutting_rate','production_management_rate','positive_profit_share_rate','negative_profit_share_rate','external_value_share_rate','external_processing_income','external_cutting_cost','rent_utilities_estimate','other_expenses','offset_amount','jianfeng_social_deduction','jianfeng_manual_payment','jianfeng_other'];
  const productionErrorLabels={production_month_locked:'月份已锁定',production_conflict:'数据已变化，请刷新后重新提交',production_placeholder_prices:'仍有待确认工价',production_pending_requests:'仍有待审批申请',production_request_pending_exists:'该记录已有待审批申请'};

  function productionEscape(value){return String(value??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));}
  function productionMoney(value){return Number(value||0).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});}
  function productionDate(value){return String(value||'').slice(0,10);}
  function productionDateTime(value){return value?new Date(value).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';}
  function productionHas(permission){return (window.JUN_CONTEXT?.permissions||[]).includes(permission);}
  function productionBadge(status){const item=productionRequestLabels[status]||[status||'未知','bg-secondary-lt'];return `<span class="badge ${item[1]}">${item[0]}</span>`;}
  function productionReason(code){return productionReasonConfig[code]?.label||code||'未分类';}
  function productionValue(field,value){if(field==='include_in_payroll')return value?'计入':'不计入';if(['quantity','unit_price','supplement'].includes(field))return productionMoney(value);return value||'—';}

  async function productionApi(path,options={}){const response=await fetch(path,options);const payload=await response.json().catch(()=>({}));if(!response.ok){const error=new Error(productionErrorLabels[payload.error]||payload.detail||payload.error||'请求失败');error.payload=payload;throw error;}return payload;}
  function productionAlert(message,type='secondary'){document.getElementById('production-alert').innerHTML=message?`<div class="alert alert-${type} py-2 mb-2">${productionEscape(message)}</div>`:'';}

  function productionSetControls(){const open=productionState.data?.month?.status==='open';document.getElementById('production-add').hidden=!(open&&productionHas('production.edit'));document.getElementById('production-finalize').hidden=!(open&&productionHas('production.finalize'));document.getElementById('production-reopen').hidden=open||!productionHas('production.approve');document.getElementById('production-finance-edit').hidden=!(productionState.view==='finance'&&open&&productionHas('production.finance.manage'));}
  function productionRenderKpis(){const summary=productionState.data?.summary||{};const requests=summary.requests||{};const finance=productionState.data?.factory_finance?.values||{};const sourceAt=productionState.data?.month?.source_captured_at;const values=[['有效条目',summary.eligible_row_count||0],['自动工钱',`¥${productionMoney(summary.payroll_amount)}`],['待审批',requests.pending||0],['工厂利润',`¥${productionMoney(finance.profit)}`],['ERP 同步',sourceAt?productionDateTime(sourceAt):'未同步']];document.getElementById('production-kpis').innerHTML=values.map(item=>`<div class="production-kpi"><div class="production-kpi-label">${item[0]}</div><div class="production-kpi-value">${item[1]}</div></div>`).join('');}

  function productionFilteredLines(){const search=productionState.search.toLowerCase();return (productionState.data?.lines||[]).filter(line=>{if(productionState.worker&&line.worker_name!==productionState.worker)return false;if(!search)return true;return [line.product_code,line.worker_name,line.request_no,line.note,line.color,line.size,...(line.pending_requests||[]).flatMap(item=>[item.request_no,item.reason_detail])].some(value=>String(value||'').toLowerCase().includes(search));});}
  function productionRenderLines(){const open=productionState.data?.month?.status==='open';const canEdit=open&&productionHas('production.edit');const lines=productionFilteredLines();const body=lines.map(line=>{const pending=(line.pending_requests||[])[0];const action=pending?`<button class="btn btn-sm btn-outline-warning" type="button" data-request-view="${productionEscape(pending.id)}">查看申请</button>`:canEdit?`<button class="btn btn-sm btn-outline-primary" type="button" data-line-request="${productionEscape(line.id)}"><i class="ti ti-edit me-1"></i>申请调整</button>`:'—';return `<tr class="${line.eligible?'':'is-excluded'} ${line.changed?'is-changed':''} ${pending?'is-pending':''}"><td>${line.source_row_no??'加项'}</td><td>${productionEscape(productionDate(line.work_date))}</td><td class="production-code">${productionEscape(line.product_code)}</td><td>${productionEscape([line.color,line.size].filter(Boolean).join(' / '))}</td><td class="production-number">${line.quantity}</td><td class="production-number">${line.unit_price===null?'<span class="text-danger">待确认</span>':productionMoney(line.unit_price)}</td><td class="production-number">${productionMoney(line.supplement)}</td><td class="production-number fw-semibold">${productionMoney(line.amount)}</td><td>${productionEscape(line.worker_name)}</td><td>${productionEscape(line.work_type)}</td><td>${productionEscape(line.value_attribution)}</td><td>${pending?`${productionBadge('pending')}<div class="small text-secondary mt-1">${productionEscape(pending.request_no)}</div>`:line.changed?productionBadge('approved'):productionBadge('not_required')}</td><td>${line.eligible?'<span class="text-success">计入</span>':`<span class="text-danger" title="${productionEscape(line.exclusion_reason)}">排除</span>`}</td><td>${action}</td></tr>`;}).join('');document.getElementById('production-lines-view').innerHTML=`<div class="production-table-wrap"><table class="table table-vcenter table-hover production-table"><thead><tr><th>行</th><th>日期</th><th>商品编号</th><th>颜色/尺码</th><th class="text-end">数量</th><th class="text-end">单价</th><th class="text-end">补价</th><th class="text-end">金额</th><th>往来单位</th><th>类型</th><th>产值归属</th><th>变更</th><th>工资/产值</th><th></th></tr></thead><tbody>${body}</tbody></table>${body?'':'<div class="production-empty">没有符合条件的记工记录</div>'}</div>`;}

  function productionFilteredRequests(){const search=productionState.search.toLowerCase();return (productionState.data?.requests||[]).filter(request=>{if(productionState.requestStatus&&request.status!==productionState.requestStatus)return false;if(!search)return true;return [request.request_no,request.submitted_by_name,request.reason_detail,request.proposed_values?.product_code,request.proposed_values?.worker_name,request.note].some(value=>String(value||'').toLowerCase().includes(search));});}
  function productionRenderRequests(){const counts=productionState.data?.summary?.requests||{};const stats=[['待审批',counts.pending||0,'text-warning'],['已批准',counts.approved||0,'text-success'],['已驳回',counts.rejected||0,'text-danger'],['历史迁入',counts.legacy_imported||0,'text-secondary']];const rows=productionFilteredRequests().map(request=>{const fields=(request.changed_fields||[]).map(field=>`<span class="production-chip">${productionEscape(productionFieldLabels[field]||field)}</span>`).join('');return `<article class="production-request"><div><div class="production-request-title"><span>${productionEscape(request.request_no)}</span>${productionBadge(request.status)}${request.source==='wecom_import'?'<span class="badge bg-secondary-lt">历史迁入</span>':''}${request.stale?'<span class="badge bg-red-lt">原记录已变化</span>':''}</div><div class="production-request-meta">${productionEscape(request.submitted_by_name||'未知申请人')} · ${productionDateTime(request.submitted_at)}</div></div><div><div class="production-request-reason">${productionEscape(productionReason(request.reason_code))}</div><div class="text-secondary small">${productionEscape(request.reason_detail)}</div><div class="production-chips">${fields}</div></div><div><div class="small text-secondary">${productionEscape(request.proposed_values?.product_code||'新增计工')}</div><div class="fw-semibold">¥${productionMoney(request.proposed_amount)} <span class="small ${Number(request.amount_delta)>=0?'text-success':'text-danger'}">${Number(request.amount_delta)>=0?'+':''}${productionMoney(request.amount_delta)}</span></div></div><button class="btn btn-sm btn-outline-primary" type="button" data-request-view="${productionEscape(request.id)}">查看</button></article>`;}).join('');document.getElementById('production-requests-view').innerHTML=`<div class="production-stat-grid">${stats.map(item=>`<div class="production-stat"><span class="small text-secondary">${item[0]}</span><strong class="${item[2]}">${item[1]}</strong></div>`).join('')}</div><div class="production-request-list">${rows||'<div class="production-empty">没有符合条件的审批申请</div>'}</div>`;}

  function productionRenderWages(){const summary=productionState.data?.summary||{};const finance=productionState.data?.factory_finance?.values||{};const rows=(summary.workers||[]).map(item=>`<tr><td>${productionEscape(item.name)}</td><td class="production-number fw-semibold">${productionMoney(item.payroll_amount)}</td><td class="production-number">${productionMoney(item.external_value_amount)}</td><td class="production-number text-danger">${productionMoney(item.excluded_amount)}</td><td class="production-number">${item.row_count}</td></tr>`).join('');const components=[['普通计件工钱',finance.jianfeng_regular_wage],['裁剪管理费',finance.cutting_management_fee],['制作管理费',finance.production_management_fee],['个人利润',finance.personal_profit],['外发货值分成',finance.external_value_share],['其他调整',productionState.data?.finance_inputs?.jianfeng_other],['个人收入合计',finance.jianfeng_personal_income]];document.getElementById('production-wages-view').innerHTML=`<div class="production-summary-grid"><div class="production-section"><div class="production-section-head"><h3 class="production-section-title">员工工资</h3><span class="text-secondary small">合计 ¥${productionMoney(summary.payroll_amount)}</span></div><div class="table-responsive"><table class="table table-vcenter"><thead><tr><th>姓名/往来单位</th><th class="text-end">自动工钱</th><th class="text-end">外发货值</th><th class="text-end">排除金额</th><th class="text-end">条目</th></tr></thead><tbody>${rows}</tbody></table></div></div><div class="production-section"><div class="production-section-head"><h3 class="production-section-title">林剑锋收入构成</h3></div><table class="table table-vcenter"><tbody>${components.map((item,index)=>`<tr class="${index===components.length-1?'fw-bold':''}"><td>${item[0]}</td><td class="production-number">${productionMoney(item[1])}</td></tr>`).join('')}</tbody></table></div></div>`;}

  function productionRenderFinance(){const report=productionState.data?.factory_finance||{};const v=report.values||{};const i=report.inputs||{};const income=[['内部产值收入',v.internal_income,`${productionMoney(v.internal_value)} × ${i.internal_value_multiplier}`],['内部样衣收入',v.sample_income,`${productionMoney(v.sample_value)} × ${i.sample_value_multiplier}`],['外加工收入',v.external_processing_income,'月度核算输入'],['总收入',v.total_income,'内部产值收入 + 样衣收入 + 外加工收入']];const expenses=[['工人工资',v.worker_wages,'已批准且计入的非外发货值条目'],['工厂房租水电（预估）',v.rent_utilities_estimate,'记工表固定预估口径'],['裁剪管理费',v.cutting_management_fee,`需裁剪内部产值 × ${i.cutting_rate} + 样衣产值 × ${i.sample_cutting_rate} + 额外裁剪费`],['制作管理费',v.production_management_fee,`（内部产值 + 样衣产值）× ${i.production_management_rate}`],['其他费用',v.other_expenses,'月度核算输入'],['冲抵金额',-Number(v.offset_amount||0),'减少费用'],['总费用',v.total_expenses,'以上费用合计']];const settlement=[['全体工人工资',v.worker_wages],['裁剪管理费',v.cutting_management_fee],['制作管理费',v.production_management_fee],['个人利润',v.personal_profit],['外发货值分成',v.external_value_share],['手工费用代发',i.jianfeng_manual_payment],['其他调整',i.jianfeng_other],['个人医社保扣除',-Number(i.jianfeng_social_deduction||0)],['结算金额',v.jianfeng_settlement]];document.getElementById('production-finance-view').innerHTML=`<div class="production-summary-grid"><div><div class="production-section"><div class="production-section-head"><h3 class="production-section-title">工厂收支利润表</h3><span class="production-profit ${Number(v.profit)>=0?'text-success':'text-danger'}">¥${productionMoney(v.profit)}</span></div><div class="table-responsive"><table class="table table-vcenter"><thead><tr><th>项目</th><th class="text-end">金额</th><th>公式/口径</th></tr></thead><tbody>${income.map(item=>`<tr><td>${item[0]}</td><td class="production-number fw-semibold">${productionMoney(item[1])}</td><td><span class="production-formula">${productionEscape(item[2])}</span></td></tr>`).join('')}<tr><td colspan="3" class="bg-light fw-bold">费用</td></tr>${expenses.map(item=>`<tr><td>${item[0]}</td><td class="production-number ${Number(item[1])<0?'text-success':''}">${productionMoney(item[1])}</td><td><span class="production-formula">${productionEscape(item[2])}</span></td></tr>`).join('')}<tr class="fw-bold"><td>利润</td><td class="production-number ${Number(v.profit)>=0?'text-success':'text-danger'}">${productionMoney(v.profit)}</td><td><span class="production-formula">总收入 − 总费用</span></td></tr><tr><td>个人利润</td><td class="production-number">${productionMoney(v.personal_profit)}</td><td><span class="production-formula">利润为正 × ${i.positive_profit_share_rate}；亏损 × ${i.negative_profit_share_rate}</span></td></tr></tbody></table></div></div></div><div class="production-section"><div class="production-section-head"><h3 class="production-section-title">工厂结算</h3></div><table class="table table-vcenter"><tbody>${settlement.map((item,index)=>`<tr class="${index===settlement.length-1?'fw-bold':''}"><td>${item[0]}</td><td class="production-number">${productionMoney(item[1])}</td></tr>`).join('')}</tbody></table>${i.note?`<div class="p-3 border-top text-secondary small">${productionEscape(i.note)}</div>`:''}</div></div>`;}

  function productionRender(){productionRenderKpis();productionRenderLines();productionRenderRequests();productionRenderWages();productionRenderFinance();document.querySelectorAll('[data-production-view]').forEach(button=>button.classList.toggle('active',button.dataset.productionView===productionState.view));['lines','requests','wages','finance'].forEach(view=>document.getElementById(`production-${view}-view`).hidden=view!==productionState.view);document.querySelectorAll('[data-production-line-filter]').forEach(item=>item.hidden=!['lines','requests'].includes(productionState.view));document.querySelectorAll('[data-production-lines-only]').forEach(item=>item.hidden=productionState.view!=='lines');document.querySelectorAll('[data-production-request-filter]').forEach(item=>item.hidden=productionState.view!=='requests');const workers=[...new Set((productionState.data?.lines||[]).map(line=>line.worker_name).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh-CN'));const selector=document.getElementById('production-worker');const current=selector.value;selector.innerHTML='<option value="">全部</option>'+workers.map(value=>`<option value="${productionEscape(value)}">${productionEscape(value)}</option>`).join('');selector.value=workers.includes(current)?current:'';const status=productionStatusLabels[productionState.data?.month?.status]||['未同步','bg-secondary-lt'];const target=document.getElementById('production-status');target.className=`badge production-status ${status[1]}`;target.textContent=status[0];productionSetControls();}
  async function productionLoadMonth(month){if(!month)return;productionAlert('正在读取生产记工数据…');try{productionState.data=await productionApi(`/api/production/months/${month}`);productionAlert('');productionRender();}catch(error){productionAlert(error.message,'danger');}}
  async function productionInitialize(){await window.JUN_AUTH_READY;try{const payload=await productionApi('/api/production/months');productionState.months=payload.months||[];const selector=document.getElementById('production-month');selector.innerHTML=productionState.months.map(item=>`<option value="${item.month}">${item.month}</option>`).join('');if(!productionState.months.length){selector.innerHTML='<option value="">暂无数据</option>';productionAlert('生产数据尚未同步','warning');productionRenderKpis();return;}await productionLoadMonth(selector.value);}catch(error){productionAlert(error.message,'danger');}}

  function productionLineValues(line){return {work_date:productionDate(line?.work_date),product_code:line?.product_code||'',color:line?.color||'',size:line?.size||'',quantity:Number(line?.quantity??1),unit_price:Number(line?.unit_price??0),supplement:Number(line?.supplement??0),worker_name:line?.worker_name||'',work_type:line?.work_type||'大货',value_attribution:line?.value_attribution||'内部产值',cutting_type:line?.cutting_type||'内部裁剪',include_in_payroll:line?.include_in_payroll!==false,exclusion_reason:line?.exclusion_reason||'',note:line?.note||''};}
  function productionSetSelectedFields(fields,create=false){const selected=new Set(create?productionEditableFields:fields);document.getElementById('production-field-picker-wrap').hidden=create;document.querySelectorAll('#production-field-picker input').forEach(input=>input.checked=selected.has(input.value));document.querySelectorAll('[data-production-value]').forEach(wrapper=>{const field=wrapper.dataset.productionValue;wrapper.hidden=!selected.has(field);wrapper.querySelectorAll('input,select').forEach(input=>input.disabled=!selected.has(field));});}
  function productionUpdateAmount(){const form=document.getElementById('production-request-form');const quantity=Number(form.elements.quantity.value||0);const price=Number(form.elements.unit_price.value||0);const supplement=Number(form.elements.supplement.value||0);document.getElementById('production-proposed-amount').textContent=`¥${productionMoney(quantity*price+supplement)}`;}
  function productionOpenEditor(line){productionState.editingLine=line||null;const create=!line;const form=document.getElementById('production-request-form');form.reset();const values=productionLineValues(line||{work_date:`${document.getElementById('production-month').value}-01`});Object.entries(values).forEach(([field,value])=>{const name=field==='note'?'line_note':field;if(form.elements[name]){if(field==='include_in_payroll')form.elements[name].checked=value;else form.elements[name].value=value??'';}});const reason=form.elements.reason_code;reason.innerHTML=Object.entries(productionReasonConfig).filter(([code])=>create?code==='manual_addition':!['manual_addition','legacy_import'].includes(code)).map(([code,item])=>`<option value="${code}">${item.label}</option>`).join('');if(!create)reason.value='price_correction';productionSetSelectedFields(create?productionEditableFields:productionReasonConfig[reason.value].fields,create);document.getElementById('production-editor-title').textContent=create?'新增计工申请':'提交调整申请';document.getElementById('production-editor-source').textContent=create?'手工新增计工':line.source_row_no?`ERP 原始行 ${line.source_row_no}`:'已批准加项';document.getElementById('production-original').hidden=create;document.getElementById('production-original').innerHTML=create?'':[['日期',productionDate(line.work_date)],['商品编号',line.product_code],['数量',line.quantity],['当前金额',`¥${productionMoney(line.amount)}`],['往来单位',line.worker_name],['类型',line.work_type],['产值归属',line.value_attribution],['裁床',line.cutting_type]].map(item=>`<div class="production-original-item"><span>${item[0]}</span><strong>${productionEscape(item[1])}</strong></div>`).join('');document.getElementById('production-form-error').textContent='';productionUpdateAmount();document.getElementById('production-request-editor').showModal();}
  function productionCollectValues(){const form=document.getElementById('production-request-form');const before=productionLineValues(productionState.editingLine||{});const create=!productionState.editingLine;const selected=create?new Set(productionEditableFields):new Set([...document.querySelectorAll('#production-field-picker input:checked')].map(input=>input.value));if(!selected.size)throw new Error('至少选择一个调整内容');const values={...before};for(const field of selected){const name=field==='note'?'line_note':field;if(field==='include_in_payroll')values[field]=form.elements[name].checked;else if(productionNumericFields.has(field))values[field]=Number(form.elements[name].value||0);else values[field]=form.elements[name].value.trim();}if(values.include_in_payroll)values.exclusion_reason='';return values;}
  async function productionSubmitRequest(event){event.preventDefault();const form=event.currentTarget;const line=productionState.editingLine;const button=document.getElementById('production-request-submit');button.disabled=true;try{const values=productionCollectValues();const month=document.getElementById('production-month').value;const body={target_source_line_id:line?.source_line_id||null,target_entry_id:line?.entry_id||null,reason_code:form.elements.reason_code.value,reason_detail:form.elements.reason_detail.value.trim(),note:form.elements.request_note.value.trim(),values};await productionApi(`/api/production/months/${month}/requests`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});document.getElementById('production-request-editor').close();await productionLoadMonth(month);productionAlert('申请已提交，康总批准后自动生效','success');}catch(error){document.getElementById('production-form-error').textContent=error.message;}finally{button.disabled=false;}}

  function productionOpenDetail(request){productionState.detailRequest=request;document.getElementById('production-detail-title').textContent=`审批 ${request.request_no}`;document.getElementById('production-detail-meta').textContent=`${request.submitted_by_name||'未知申请人'} · ${productionDateTime(request.submitted_at)}`;const fields=request.changed_fields||[];const rows=fields.map(field=>`<tr><th>${productionEscape(productionFieldLabels[field]||field)}</th><td>${productionEscape(productionValue(field,request.before_values?.[field]))}</td><td class="fw-semibold">${productionEscape(productionValue(field,request.proposed_values?.[field]))}</td></tr>`).join('');document.getElementById('production-detail-body').innerHTML=`<div class="d-flex gap-2 flex-wrap mb-3">${productionBadge(request.status)}<span class="badge bg-blue-lt">${productionEscape(productionReason(request.reason_code))}</span>${request.source==='wecom_import'?'<span class="badge bg-secondary-lt">历史企业微信迁入</span>':''}${request.stale?'<span class="badge bg-red-lt">原记录已变化</span>':''}</div><dl class="row mb-3"><dt class="col-3 text-secondary">原因</dt><dd class="col-9">${productionEscape(request.reason_detail)}</dd><dt class="col-3 text-secondary">申请备注</dt><dd class="col-9">${productionEscape(request.note||'—')}</dd><dt class="col-3 text-secondary">金额变化</dt><dd class="col-9">¥${productionMoney(request.before_amount)} → <strong>¥${productionMoney(request.proposed_amount)}</strong>（${Number(request.amount_delta)>=0?'+':''}${productionMoney(request.amount_delta)}）</dd>${request.review_note?`<dt class="col-3 text-secondary">审批意见</dt><dd class="col-9">${productionEscape(request.review_note)}</dd>`:''}</dl><div class="table-responsive"><table class="production-diff"><thead><tr><th>调整字段</th><th>原值</th><th>申请值</th></tr></thead><tbody>${rows}</tbody></table></div>`;const pending=request.status==='pending';const canApprove=pending&&productionHas('production.approve')&&!request.stale;const userId=window.JUN_CONTEXT?.profile?.id;document.getElementById('production-review-note-wrap').hidden=!canApprove;document.getElementById('production-review-note').value='';document.getElementById('production-approve-request').hidden=!canApprove;document.getElementById('production-reject-request').hidden=!(pending&&productionHas('production.approve'));document.getElementById('production-cancel-request').hidden=!(pending&&productionHas('production.edit')&&(request.submitted_by===userId||productionHas('production.approve')));document.getElementById('production-review-error').textContent='';document.getElementById('production-request-detail').showModal();}
  async function productionReview(decision){const request=productionState.detailRequest;const note=document.getElementById('production-review-note').value.trim();if(decision==='rejected'&&note.length<2){document.getElementById('production-review-error').textContent='驳回时必须填写审批意见';return;}const buttons=[document.getElementById('production-approve-request'),document.getElementById('production-reject-request')];buttons.forEach(button=>button.disabled=true);try{await productionApi(`/api/production/requests/${request.id}/review`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({expected_version:request.version,decision,review_note:note})});document.getElementById('production-request-detail').close();await productionLoadMonth(request.month);productionAlert(decision==='approved'?'申请已批准并写入正式记工':'申请已驳回','success');}catch(error){document.getElementById('production-review-error').textContent=error.message;}finally{buttons.forEach(button=>button.disabled=false);}}
  async function productionCancelRequest(){const request=productionState.detailRequest;if(!confirm(`确认撤回 ${request.request_no}？`))return;try{await productionApi(`/api/production/requests/${request.id}/cancel`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({expected_version:request.version})});document.getElementById('production-request-detail').close();await productionLoadMonth(request.month);productionAlert('申请已撤回','success');}catch(error){document.getElementById('production-review-error').textContent=error.message;}}

  function productionOpenFinance(){const form=document.getElementById('production-finance-form');const inputs=productionState.data?.finance_inputs||{};productionFinanceFields.forEach(field=>form.elements[field].value=Number(inputs[field]||0));form.elements.note.value=inputs.note||'';document.getElementById('production-finance-error').textContent='';document.getElementById('production-finance-dialog').showModal();}
  async function productionSaveFinance(event){event.preventDefault();const form=event.currentTarget;const button=document.getElementById('production-finance-save');const values={};productionFinanceFields.forEach(field=>values[field]=Number(form.elements[field].value||0));values.note=form.elements.note.value.trim();button.disabled=true;try{const month=document.getElementById('production-month').value;await productionApi(`/api/production/months/${month}/finance-inputs`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({expected_version:productionState.data.finance_inputs.version,values})});document.getElementById('production-finance-dialog').close();await productionLoadMonth(month);productionAlert('核算参数已保存，工资和收支已自动重算','success');}catch(error){document.getElementById('production-finance-error').textContent=error.message;}finally{button.disabled=false;}}
  function productionCsv(){const headers=['日期','商品编号','颜色','尺码','数量','单价','补价','金额','往来单位','类型','产值归属','裁床','变更状态','是否计入','排除原因'];const rows=(productionState.data?.lines||[]).map(line=>[productionDate(line.work_date),line.product_code,line.color,line.size,line.quantity,line.unit_price??'',line.supplement,line.amount,line.worker_name,line.work_type,line.value_attribution,line.cutting_type,line.has_pending_change?'待审批':line.changed?'已批准':'原始记录',line.eligible?'计入':'排除',line.exclusion_reason]);const quote=value=>`"${String(value??'').replaceAll('"','""')}"`;const blob=new Blob(['\ufeff'+[headers,...rows].map(row=>row.map(quote).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download=`生产记工_${productionState.data?.month?.month||''}.csv`;link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000);}

  document.getElementById('production-field-picker').innerHTML=productionEditableFields.map(field=>`<label><input type="checkbox" value="${field}"/><span>${productionFieldLabels[field]}</span></label>`).join('');
  document.addEventListener('click',event=>{const view=event.target.closest('[data-production-view]');if(view){productionState.view=view.dataset.productionView;productionRender();return;}const lineButton=event.target.closest('[data-line-request]');if(lineButton){productionOpenEditor((productionState.data?.lines||[]).find(line=>String(line.id)===lineButton.dataset.lineRequest));return;}const requestButton=event.target.closest('[data-request-view]');if(requestButton){const request=(productionState.data?.requests||[]).find(item=>String(item.id)===requestButton.dataset.requestView);if(request)productionOpenDetail(request);return;}const close=event.target.closest('[data-production-close]');if(close){document.getElementById(close.dataset.productionClose).close();return;}});
  document.getElementById('production-request-form').addEventListener('submit',productionSubmitRequest);
  document.getElementById('production-request-form').elements.reason_code.addEventListener('change',event=>productionSetSelectedFields(productionReasonConfig[event.target.value]?.fields||[]));
  document.getElementById('production-field-picker').addEventListener('change',()=>productionSetSelectedFields([...document.querySelectorAll('#production-field-picker input:checked')].map(input=>input.value)));
  document.getElementById('production-request-form').addEventListener('input',productionUpdateAmount);
  document.getElementById('production-finance-form').addEventListener('submit',productionSaveFinance);
  document.getElementById('production-month').addEventListener('change',event=>productionLoadMonth(event.target.value));
  document.getElementById('production-search').addEventListener('input',event=>{productionState.search=event.target.value;productionRenderLines();productionRenderRequests();});
  document.getElementById('production-worker').addEventListener('change',event=>{productionState.worker=event.target.value;productionRenderLines();});
  document.getElementById('production-request-filter').addEventListener('change',event=>{productionState.requestStatus=event.target.value;productionRenderRequests();});
  document.getElementById('production-add').addEventListener('click',()=>productionOpenEditor(null));
  document.getElementById('production-export').addEventListener('click',productionCsv);
  document.getElementById('production-finance-edit').addEventListener('click',productionOpenFinance);
  document.getElementById('production-approve-request').addEventListener('click',()=>productionReview('approved'));
  document.getElementById('production-reject-request').addEventListener('click',()=>productionReview('rejected'));
  document.getElementById('production-cancel-request').addEventListener('click',productionCancelRequest);
  document.getElementById('production-finalize').addEventListener('click',async()=>{const month=document.getElementById('production-month').value;if(!confirm(`确认定稿 ${month}？定稿后不能继续提交申请。`))return;try{await productionApi(`/api/production/months/${month}/finalize`,{method:'POST'});await productionLoadMonth(month);productionAlert('本月记工已定稿','success');}catch(error){productionAlert(error.message,'danger');}});
  document.getElementById('production-reopen').addEventListener('click',async()=>{const month=document.getElementById('production-month').value;const reason=prompt('填写重新打开原因');if(!reason)return;try{await productionApi(`/api/production/months/${month}/reopen`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reason})});await productionLoadMonth(month);productionAlert('月份已重新打开','warning');}catch(error){productionAlert(error.message,'danger');}});
  productionInitialize();
  </script>
</body>
</html>
