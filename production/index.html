<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>生产记工表 — 生意中台</title>
  <link rel="stylesheet" href="/jun-pages/vendor/tabler.min.css"/>
  <link rel="stylesheet" href="/jun-pages/vendor/tabler-icons.min.css"/>
  <style>
    :root { --production-border:#dfe3e8; --production-muted:#667085; }
    .nav-link.active { background:rgba(32,107,196,.15)!important; font-weight:600; border-left:3px solid #206bc4; }
    .nav-section-label { padding:.9rem 1rem .3rem; color:rgba(255,255,255,.48); font-size:.68rem; font-weight:700; }
    .production-head { display:flex; align-items:end; justify-content:space-between; gap:1rem; flex-wrap:wrap; }
    .production-month-control { display:flex; align-items:end; gap:.55rem; flex-wrap:wrap; }
    .production-month-control .form-select { width:9rem; }
    .production-status { min-width:4.5rem; text-align:center; }
    .production-kpis { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); border:1px solid var(--production-border); border-radius:6px; background:#fff; }
    .production-kpi { min-width:0; padding:.8rem 1rem; border-right:1px solid var(--production-border); }
    .production-kpi:last-child { border-right:0; }
    .production-kpi-label { color:var(--production-muted); font-size:.72rem; }
    .production-kpi-value { margin-top:.18rem; font-size:1.25rem; line-height:1.25; font-weight:700; font-variant-numeric:tabular-nums; }
    .production-toolbar { display:flex; align-items:end; gap:.6rem; flex-wrap:wrap; padding:.85rem 0; border-bottom:1px solid var(--production-border); }
    .production-search { flex:1 1 17rem; min-width:13rem; }
    .production-filter { flex:0 1 10rem; min-width:8rem; }
    .production-actions { display:flex; gap:.45rem; margin-left:auto; flex-wrap:wrap; }
    .production-view-switch { display:inline-flex; padding:3px; border:1px solid var(--production-border); border-radius:5px; background:#f4f6f8; }
    .production-view-switch .btn { min-width:7.5rem; border:0; }
    .production-view-switch .btn.active { color:#fff; background:#206bc4; }
    .production-table-wrap { overflow:auto; border:1px solid var(--production-border); border-radius:6px; background:#fff; }
    .production-table { min-width:1480px; margin:0; }
    .production-table th { position:sticky; top:0; z-index:1; padding:.55rem .65rem; white-space:nowrap; background:#f7f8fa; }
    .production-table td { padding:.48rem .65rem; vertical-align:middle; }
    .production-table tbody tr.is-excluded { background:#fff8f7; }
    .production-table tbody tr.is-changed { box-shadow:inset 3px 0 #f59f00; }
    .production-code { min-width:7rem; font-weight:600; }
    .production-number { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
    .production-note { max-width:14rem; white-space:normal; }
    .production-empty { padding:3rem 1rem; color:var(--production-muted); text-align:center; }
    .production-summary-grid { display:grid; grid-template-columns:minmax(0,1.35fr) minmax(18rem,.65fr); gap:1rem; }
    .production-section { min-width:0; border:1px solid var(--production-border); border-radius:6px; background:#fff; }
    .production-section-head { display:flex; align-items:center; justify-content:space-between; gap:.75rem; padding:.7rem .85rem; border-bottom:1px solid var(--production-border); }
    .production-section-title { margin:0; font-size:.9rem; font-weight:700; }
    .production-section .table { margin:0; }
    .production-approval-grid { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:.75rem; margin-bottom:1rem; }
    .production-approval-stat { padding:.75rem .85rem; border:1px solid var(--production-border); border-radius:6px; background:#fff; }
    .production-approval-stat strong { display:block; font-size:1.15rem; font-variant-numeric:tabular-nums; }
    .production-dialog { width:min(94vw,880px); max-height:92vh; padding:0; border:0; border-radius:6px; box-shadow:0 24px 70px rgba(17,24,39,.28); }
    .production-dialog::backdrop { background:rgba(17,24,39,.58); }
    .production-dialog form { display:flex; max-height:92vh; margin:0; flex-direction:column; }
    .production-dialog-head { display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:.85rem 1rem; border-bottom:1px solid var(--production-border); }
    .production-dialog-body { min-height:0; padding:1rem; overflow:auto; }
    .production-dialog-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:.8rem; }
    .production-span-2 { grid-column:span 2; }
    .production-span-4 { grid-column:span 4; }
    .production-dialog-actions { display:flex; justify-content:flex-end; gap:.5rem; padding:.85rem 1rem; border-top:1px solid var(--production-border); }
    .production-alert { min-height:22px; margin:.5rem 0 0; }
    .bottom-tab-bar { display:none; position:fixed; right:0; bottom:0; left:0; z-index:1050; padding:4px 0 env(safe-area-inset-bottom,4px); border-top:1px solid #e6e8eb; background:#fff; }
    .bottom-tab-bar .tab-items { display:flex; align-items:center; justify-content:space-around; }
    .bottom-tab-bar .tab-item { display:flex; min-width:0; flex-direction:column; align-items:center; padding:4px 5px; color:#667; font-size:.68rem; text-decoration:none; }
    .bottom-tab-bar .tab-item i { margin-bottom:2px; font-size:1.25rem; }
    .bottom-tab-bar .tab-item.active { color:#206bc4; font-weight:600; }
    @media (max-width:991px) {
      .bottom-tab-bar { display:block; }
      .page-body { padding-bottom:76px; }
      .production-kpis { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .production-kpi { border-bottom:1px solid var(--production-border); }
      .production-kpi:nth-child(2n) { border-right:0; }
      .production-kpi:last-child { grid-column:span 2; border-bottom:0; }
      .production-summary-grid { grid-template-columns:1fr; }
      .production-approval-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
    }
    @media (max-width:575px) {
      .production-head { align-items:stretch; }
      .production-month-control { width:100%; align-items:end; }
      .production-month-control label { flex:1 1 auto; }
      .production-month-control .form-select { width:100%; }
      .production-status { display:inline-flex; min-height:40px; align-items:center; justify-content:center; }
      .production-month-control .btn { flex:1 1 auto; min-height:40px; }
      .production-view-switch { display:grid; width:100%; grid-template-columns:repeat(3,1fr); }
      .production-view-switch .btn { min-width:0; padding-right:.35rem; padding-left:.35rem; }
      .production-filter { flex:1 1 calc(50% - .4rem); }
      .production-actions { width:100%; margin-left:0; }
      .production-actions .btn { flex:1 1 auto; }
      .production-dialog-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .production-span-4 { grid-column:span 2; }
      .production-dialog-actions .btn { flex:1 1 auto; }
    }
  </style>

  <script src="/jun-pages/vendor/tabler.min.js"></script>
  <script>
  const productionState = {months:[], data:null, view:'lines', search:'', worker:'', approval:'', editing:null};
  const productionStatusLabels = {open:['编辑中','bg-blue-lt'], finalized:['已定稿','bg-orange-lt'], verified:['已核验','bg-green-lt']};
  const productionApprovalLabels = {not_required:['无需审批','bg-secondary-lt'], unverified:['待核验','bg-azure-lt'], verified:['已核验','bg-green-lt'], missing:['未找到','bg-red-lt'], pending:['审批中','bg-yellow-lt'], invalid:['未通过','bg-red-lt'], mismatch:['字段不一致','bg-orange-lt']};
  const productionErrorLabels = {production_month_locked:'月份已锁定', production_entry_conflict:'数据已被其他人更新，请刷新后再改', production_placeholder_prices:'仍有待确认工价', approval_records_empty:'文件中没有可识别的审批记录', approval_file_required:'请选择企业微信审批文件'};

  function productionEscape(value) { return String(value ?? '').replace(/[&<>'"]/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[character])); }
  function productionMoney(value) { return Number(value || 0).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2}); }
  function productionDate(value) { return String(value || '').slice(0,10); }
  function productionBadge(state) { const item=productionApprovalLabels[state]||[state||'未知','bg-secondary-lt']; return `<span class="badge ${item[1]}">${item[0]}</span>`; }
  function productionHas(permission) { return (window.JUN_CONTEXT?.permissions||[]).includes(permission); }

  async function productionApi(path, options={}) {
    const response=await fetch(path,options);
    const payload=await response.json().catch(()=>({}));
    if (!response.ok) { const error=new Error(productionErrorLabels[payload.error]||payload.detail||payload.error||'请求失败'); error.payload=payload; throw error; }
    return payload;
  }

  function productionAlert(message,type='secondary') {
    const target=document.getElementById('production-alert');
    target.innerHTML=message?`<div class="alert alert-${type} py-2 mb-2">${productionEscape(message)}</div>`:'';
  }

  function productionSetControls() {
    const month=productionState.data?.month||{};
    const open=month.status==='open';
    document.getElementById('production-add').hidden=!(open&&productionHas('production.edit'));
    document.getElementById('production-finalize').hidden=!(open&&productionHas('production.finalize'));
    document.getElementById('production-import').hidden=!productionHas('production.verify');
    document.getElementById('production-reopen').hidden=open||!productionHas('production.verify');
  }

  function productionRenderKpis() {
    const summary=productionState.data?.summary||{};
    const sourceAt=productionState.data?.month?.source_captured_at;
    const values=[
      ['有效行数',summary.active_row_count??summary.row_count??0],
      ['计入金额',`¥${productionMoney(summary.eligible_amount)}`],
      ['排除金额',`¥${productionMoney(summary.excluded_amount)}`],
      ['待核验修改',(summary.approvals?.unverified||0)+(summary.approvals?.pending||0)],
      ['ERP 同步',sourceAt?new Date(sourceAt).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'未同步']
    ];
    document.getElementById('production-kpis').innerHTML=values.map(item=>`<div class="production-kpi"><div class="production-kpi-label">${item[0]}</div><div class="production-kpi-value">${item[1]}</div></div>`).join('');
  }

  function productionFilteredLines() {
    const search=productionState.search.toLowerCase();
    return (productionState.data?.lines||[]).filter(line=>{
      if (productionState.worker&&line.worker_name!==productionState.worker) return false;
      if (productionState.approval&&line.approval_state!==productionState.approval) return false;
      if (!search) return true;
      return [line.product_code,line.worker_name,line.approval_no,line.note,line.color,line.size].some(value=>String(value||'').toLowerCase().includes(search));
    });
  }

  function productionRenderLines(lines=productionFilteredLines()) {
    const canEdit=productionState.data?.month?.status==='open'&&productionHas('production.edit');
    const body=lines.map(line=>`<tr class="${line.eligible?'':'is-excluded'} ${line.changed?'is-changed':''}">
      <td>${line.source_row_no??'加项'}</td><td>${productionEscape(productionDate(line.work_date))}</td><td class="production-code">${productionEscape(line.product_code)}</td><td>${productionEscape(line.color)}</td><td>${productionEscape(line.size)}</td>
      <td class="production-number">${line.quantity}</td><td class="production-number">${line.unit_price===null?'<span class="text-danger">待确认</span>':productionMoney(line.unit_price)}</td><td class="production-number">${productionMoney(line.supplement)}</td><td class="production-number fw-semibold">${productionMoney(line.amount)}</td>
      <td>${productionEscape(line.worker_name)}</td><td>${productionEscape(line.work_type)}</td><td>${productionEscape(line.value_attribution)}</td><td>${productionEscape(line.cutting_type)}</td>
      <td>${line.approval_no?`<span class="font-monospace">${productionEscape(line.approval_no)}</span>`:'—'}</td><td>${productionBadge(line.approval_state)}</td>
      <td>${line.eligible?'<span class="text-success">计入</span>':`<span class="text-danger" title="${productionEscape(line.exclusion_reason)}">排除</span>`}</td>
      <td>${canEdit?`<button class="btn btn-sm btn-icon btn-ghost-primary" type="button" data-production-edit="${productionEscape(line.id)}" title="修改"><i class="ti ti-edit"></i></button>`:'—'}</td>
    </tr>`).join('');
    document.getElementById('production-lines-view').innerHTML=`<div class="production-table-wrap"><table class="table table-vcenter table-hover production-table"><thead><tr><th>行</th><th>日期</th><th>商品编号</th><th>颜色</th><th>尺码</th><th class="text-end">数量</th><th class="text-end">单价</th><th class="text-end">补价</th><th class="text-end">金额</th><th>往来单位</th><th>类型</th><th>产值归属</th><th>裁床</th><th>审批号</th><th>核验</th><th>工资/产值</th><th></th></tr></thead><tbody>${body}</tbody></table>${body?'':'<div class="production-empty">没有符合条件的记工记录</div>'}</div>`;
  }

  function productionRenderApprovals() {
    const approvals=productionState.data?.summary?.approvals||{};
    const stats=[['已核验',approvals.verified||0,'text-success'],['待核验',approvals.unverified||0,'text-primary'],['审批中',approvals.pending||0,'text-warning'],['未找到/未通过',(approvals.missing||0)+(approvals.invalid||0),'text-danger'],['字段不一致',approvals.mismatch||0,'text-orange']];
    const lines=(productionState.data?.lines||[]).filter(line=>line.entry_id);
    const rows=lines.map(line=>`<tr><td class="font-monospace">${productionEscape(line.approval_no)}</td><td>${productionEscape(line.product_code)}</td><td>${productionEscape(line.worker_name)}</td><td class="production-number">${productionMoney(line.amount)}</td><td>${productionBadge(line.approval_state)}</td><td class="production-note">${(line.approval_mismatches||[]).map(item=>`${productionEscape(item.field)}：${productionEscape(item.entry)} ≠ ${productionEscape(item.approval)}`).join('<br>')||productionEscape(line.exclusion_reason)}</td></tr>`).join('');
    document.getElementById('production-approvals-view').innerHTML=`<div class="production-approval-grid">${stats.map(item=>`<div class="production-approval-stat"><span class="small text-secondary">${item[0]}</span><strong class="${item[2]}">${item[1]}</strong></div>`).join('')}</div><div class="production-section"><div class="production-section-head"><h3 class="production-section-title">审批对应记录</h3><span class="text-secondary small">${lines.length} 条修改</span></div><div class="table-responsive"><table class="table table-vcenter"><thead><tr><th>审批号</th><th>商品编号</th><th>往来单位</th><th class="text-end">金额</th><th>状态</th><th>核验结果</th></tr></thead><tbody>${rows}</tbody></table>${rows?'':'<div class="production-empty">本月没有修改记录</div>'}</div></div>`;
  }

  function productionRenderSummary() {
    const summary=productionState.data?.summary||{};
    const workerRows=(summary.workers||[]).map(item=>`<tr><td>${productionEscape(item.name)}</td><td class="production-number fw-semibold">${productionMoney(item.payroll_amount)}</td><td class="production-number">${productionMoney(item.external_value_amount)}</td><td class="production-number text-danger">${productionMoney(item.excluded_amount)}</td><td class="production-number">${item.row_count}</td></tr>`).join('');
    const attributionRows=(summary.attributions||[]).map(item=>`<tr><td>${productionEscape(item.name)}</td><td class="production-number fw-semibold">${productionMoney(item.eligible_amount)}</td><td class="production-number text-danger">${productionMoney(item.excluded_amount)}</td></tr>`).join('');
    document.getElementById('production-summary-view').innerHTML=`<div class="production-summary-grid"><div class="production-section"><div class="production-section-head"><h3 class="production-section-title">往来单位汇总</h3><span class="text-secondary small">工钱 ¥${productionMoney(summary.payroll_amount)}</span></div><div class="table-responsive"><table class="table table-vcenter"><thead><tr><th>往来单位</th><th class="text-end">工钱</th><th class="text-end">外发货值</th><th class="text-end">排除金额</th><th class="text-end">条目</th></tr></thead><tbody>${workerRows}</tbody></table></div></div><div class="production-section"><div class="production-section-head"><h3 class="production-section-title">产值归属</h3><span class="text-secondary small">裁床计入 ¥${productionMoney(summary.eligible_cutting_amount)}</span></div><div class="table-responsive"><table class="table table-vcenter"><thead><tr><th>归属</th><th class="text-end">计入金额</th><th class="text-end">排除金额</th></tr></thead><tbody>${attributionRows}</tbody></table></div></div></div>`;
  }

  function productionRender() {
    productionRenderKpis();
    productionRenderLines();
    productionRenderApprovals();
    productionRenderSummary();
    document.querySelectorAll('[data-production-view]').forEach(button=>button.classList.toggle('active',button.dataset.productionView===productionState.view));
    ['lines','approvals','summary'].forEach(view=>document.getElementById(`production-${view}-view`).hidden=view!==productionState.view);
    const workers=[...new Set((productionState.data?.lines||[]).map(line=>line.worker_name).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh-CN'));
    const workerSelect=document.getElementById('production-worker');
    const current=workerSelect.value;
    workerSelect.innerHTML='<option value="">全部</option>'+workers.map(value=>`<option value="${productionEscape(value)}">${productionEscape(value)}</option>`).join('');
    workerSelect.value=workers.includes(current)?current:'';
    const status=productionStatusLabels[productionState.data?.month?.status]||['未同步','bg-secondary-lt'];
    const statusTarget=document.getElementById('production-status');
    statusTarget.className=`badge production-status ${status[1]}`;
    statusTarget.textContent=status[0];
    productionSetControls();
  }

  async function productionLoadMonth(month) {
    if (!month) return;
    productionAlert('正在读取生产记工数据…','secondary');
    try { productionState.data=await productionApi(`/api/production/months/${month}`); productionAlert(''); productionRender(); }
    catch(error) { productionAlert(error.message,'danger'); }
  }

  async function productionInitialize() {
    await window.JUN_AUTH_READY;
    try {
      const payload=await productionApi('/api/production/months');
      productionState.months=payload.months||[];
      const selector=document.getElementById('production-month');
      selector.innerHTML=productionState.months.map(item=>`<option value="${item.month}">${item.month}</option>`).join('');
      if (!productionState.months.length) { selector.innerHTML='<option value="">暂无数据</option>'; productionAlert('生产数据尚未同步','warning'); productionRenderKpis(); productionSetControls(); return; }
      await productionLoadMonth(selector.value);
    } catch(error) { productionAlert(error.message,'danger'); }
  }

  function productionOpenEditor(line) {
    productionState.editing=line||null;
    const form=document.getElementById('production-form');
    form.reset();
    const values=line||{work_date:`${document.getElementById('production-month').value}-01`,quantity:1,unit_price:0,supplement:0,work_type:'大货',value_attribution:'内部产值',cutting_type:'内部裁剪',include_in_payroll:true};
    ['work_date','product_code','color','size','quantity','unit_price','supplement','worker_name','work_type','value_attribution','cutting_type','approval_no','note','exclusion_reason'].forEach(name=>{ form.elements[name].value=values[name]??''; });
    form.elements.include_in_payroll.checked=values.include_in_payroll!==false;
    form.elements.exclusion_reason.disabled=form.elements.include_in_payroll.checked;
    document.getElementById('production-editor-title').textContent=line?'修改记工':'新增记工';
    document.getElementById('production-editor-source').textContent=line?.source_row_no?`ERP 原始行 ${line.source_row_no}`:'手工加项';
    document.getElementById('production-form-error').textContent='';
    document.getElementById('production-editor').showModal();
  }

  async function productionSave(event) {
    event.preventDefault();
    const form=event.currentTarget;
    const line=productionState.editing;
    const values={};
    ['work_date','product_code','color','size','worker_name','work_type','value_attribution','cutting_type','note','exclusion_reason'].forEach(name=>values[name]=form.elements[name].value.trim());
    ['quantity','unit_price','supplement'].forEach(name=>values[name]=Number(form.elements[name].value||0));
    values.include_in_payroll=form.elements.include_in_payroll.checked;
    const body={source_line_id:line?.source_line_id||null,expected_version:line?.version??null,approval_no:form.elements.approval_no.value.trim(),values};
    const month=document.getElementById('production-month').value;
    const path=line?.entry_id?`/api/production/months/${month}/entries/${line.entry_id}`:`/api/production/months/${month}/entries`;
    const save=document.getElementById('production-save'); save.disabled=true;
    try { await productionApi(path,{method:line?.entry_id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); document.getElementById('production-editor').close(); await productionLoadMonth(month); productionAlert('修改已保存，审批核验前不计入工资和产值','success'); }
    catch(error) { document.getElementById('production-form-error').textContent=error.message; }
    finally { save.disabled=false; }
  }

  function productionCsv() {
    const headers=['日期','商品编号','颜色','尺码','数量','单价','补价','金额','往来单位','审批号','类型','产值归属','是否过裁床','核验状态','是否计入','排除原因'];
    const rows=(productionState.data?.lines||[]).map(line=>[productionDate(line.work_date),line.product_code,line.color,line.size,line.quantity,line.unit_price??'',line.supplement,line.amount,line.worker_name,line.approval_no,line.work_type,line.value_attribution,line.cutting_type,productionApprovalLabels[line.approval_state]?.[0]||line.approval_state,line.eligible?'计入':'排除',line.exclusion_reason]);
    const quote=value=>`"${String(value??'').replaceAll('"','""')}"`;
    const blob=new Blob(['\ufeff'+[headers,...rows].map(row=>row.map(quote).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});
    const link=document.createElement('a'); link.href=URL.createObjectURL(blob); link.download=`生产记工_${productionState.data?.month?.month||''}.csv`; link.click(); setTimeout(()=>URL.revokeObjectURL(link.href),1000);
  }

  document.addEventListener('click',async event=>{
    const view=event.target.closest('[data-production-view]'); if(view){ productionState.view=view.dataset.productionView; productionRender(); return; }
    const edit=event.target.closest('[data-production-edit]'); if(edit){ productionOpenEditor((productionState.data?.lines||[]).find(line=>String(line.id)===edit.dataset.productionEdit)); return; }
    if(event.target.closest('[data-production-close]')){ document.getElementById('production-editor').close(); return; }
  });
  document.getElementById('production-form').addEventListener('submit',productionSave);
  document.getElementById('production-form').elements.include_in_payroll.addEventListener('change',event=>{ const reason=document.getElementById('production-form').elements.exclusion_reason; reason.disabled=event.target.checked; if(event.target.checked) reason.value=''; });
  document.getElementById('production-month').addEventListener('change',event=>productionLoadMonth(event.target.value));
  document.getElementById('production-search').addEventListener('input',event=>{productionState.search=event.target.value;productionRenderLines();});
  document.getElementById('production-worker').addEventListener('change',event=>{productionState.worker=event.target.value;productionRenderLines();});
  document.getElementById('production-approval-filter').addEventListener('change',event=>{productionState.approval=event.target.value;productionRenderLines();});
  document.getElementById('production-add').addEventListener('click',()=>productionOpenEditor(null));
  document.getElementById('production-export').addEventListener('click',productionCsv);
  document.getElementById('production-import').addEventListener('click',()=>document.getElementById('production-import-file').click());
  document.getElementById('production-import-file').addEventListener('change',async event=>{ const file=event.target.files[0]; if(!file)return; const month=document.getElementById('production-month').value; const form=new FormData(); form.append('file',file); productionAlert('正在核验企业微信审批…','primary'); try{ const payload=await productionApi(`/api/production/months/${month}/approvals/import`,{method:'POST',body:form}); productionState.data=payload.data; productionRender(); productionAlert(`核验完成：通过 ${payload.result.verified} 条，排除 ${Number(payload.result.missing||0)+Number(payload.result.pending||0)+Number(payload.result.invalid||0)+Number(payload.result.mismatch||0)} 条`,'success'); }catch(error){productionAlert(error.message,'danger');} finally{event.target.value='';} });
  document.getElementById('production-finalize').addEventListener('click',async()=>{ const month=document.getElementById('production-month').value; if(!confirm(`确认定稿 ${month}？定稿后剑锋不能继续修改。`))return; try{await productionApi(`/api/production/months/${month}/finalize`,{method:'POST'});await productionLoadMonth(month);productionAlert('本月记工已定稿','success');}catch(error){productionAlert(error.message,'danger');} });
  document.getElementById('production-reopen').addEventListener('click',async()=>{ const month=document.getElementById('production-month').value; const reason=prompt('填写重新打开原因'); if(!reason)return; try{await productionApi(`/api/production/months/${month}/reopen`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reason})});await productionLoadMonth(month);productionAlert('月份已重新打开','warning');}catch(error){productionAlert(error.message,'danger');} });
  productionInitialize();
  </script>
</body>
</html>
